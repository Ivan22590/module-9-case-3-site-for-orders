<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка для тёплых клиентов</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f4f6f9; color: #222; min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 24px;
        }
        .card {
            background: #fff; border-radius: 12px; padding: 32px;
            max-width: 520px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,.08);
        }
        h1 { font-size: 22px; margin-bottom: 6px; }
        .sub { color: #666; font-size: 14px; margin-bottom: 22px; }
        label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 5px; }
        input, select, textarea {
            width: 100%; padding: 10px 12px; border: 1px solid #d5dbe3;
            border-radius: 8px; font-size: 14px; background: #fafbfc;
        }
        textarea { resize: vertical; min-height: 80px; }
        button {
            margin-top: 20px; width: 100%; padding: 12px; border: 0; border-radius: 8px;
            background: #2b6cb0; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
        }
        button:hover { background: #2b5f9e; }
        button:disabled { background: #9db8d4; cursor: wait; }
        .status { margin-top: 14px; font-size: 14px; display: none; }
        .ok { color: #2f855a; }
        .err { color: #c53030; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Оставить заявку</h1>
        <p class="sub">Форма для тёплых клиентов — заполните данные, и мы свяжемся с вами.</p>

        <form id="lead-form">
            <label for="contact">Контактные данные (телефон / e-mail) *</label>
            <input id="contact" name="contact" required placeholder="+7 900 000-00-00 или mail@example.com">

            <label for="business">Информация о бизнесе</label>
            <textarea id="business" name="business" placeholder="Чем занимаетесь, какие задачи решаете"></textarea>

            <label for="budget">Бюджет</label>
            <select id="budget" name="budget">
                <option value="">— не выбрано —</option>
                <option value="<100k">до 100 000 ₽</option>
                <option value="100-300k">100 000 – 300 000 ₽</option>
                <option value="300-1M">300 000 – 1 000 000 ₽</option>
                <option value=">1M">более 1 000 000 ₽</option>
            </select>

            <label for="channel">Удобный способ связи</label>
            <select id="channel" name="channel">
                <option value="phone">Телефон</option>
                <option value="email">E-mail</option>
                <option value="telegram">Telegram</option>
                <option value="whatsapp">WhatsApp</option>
            </select>

            <label for="comment">Комментарий</label>
            <textarea id="comment" name="comment" placeholder="Дополнительные пожелания, ссылки, сроки"></textarea>

            <button type="submit" id="submit-btn">Отправить заявку</button>
            <p class="status" id="status"></p>
        </form>
    </div>

<script>
// Агрегация лид-метрик и технической информации на стороне фронта,
// отправка единым пакетом в backend через nginx (/api/leads).
function collectPayload(form) {
    const data = Object.fromEntries(new FormData(form).entries());
    return {
        ...data,
        // Лид-метрики
        metrics: {
            referrer: document.referrer || null,
            utm: Object.fromEntries(new URLSearchParams(window.location.search)),
            landing: window.location.href,
            submitted_at: new Date().toISOString()
        },
        // Техническая информация
        tech: {
            user_agent: navigator.userAgent,
            language: navigator.language,
            screen: { w: screen.width, h: screen.height },
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
        }
    };
}

document.getElementById('lead-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const status = document.getElementById('status');
    btn.disabled = true;
    status.className = 'status';
    status.style.display = 'block';
    status.textContent = 'Отправляем…';

    try {
        const payload = collectPayload(e.target);
        const res = await fetch('/api/leads', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        status.textContent = 'Заявка отправлена! Мы свяжемся с вами.';
        status.classList.add('ok');
        e.target.reset();
    } catch (err) {
        status.textContent = 'Ошибка отправки. Попробуйте ещё раз.';
        status.classList.add('err');
    } finally {
        btn.disabled = false;
    }
});
</script>
</body>
</html>
