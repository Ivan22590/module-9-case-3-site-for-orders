server {
    listen 80;
    server_name _;

    # Docker embedded DNS: перебираем IP backend'а на каждый запрос,
    # чтобы перевыпуск контейнера (watchtower) не ломал прокси
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- Статика фронтенда ---
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- OpenAPI JSON для Swagger UI ---
    # FastAPI отдаёт /openapi.json, Swagger UI тянет его по абсолютному пути.
    location = /openapi.json {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
    }

    # --- Proxy API на backend по внутренней сети ---
    # Backend наружу не торчит: доступен только отсюда.
    # Regex-локейшн захватывает путь после /api/ в $1.
    location ~ ^/api/(.*) {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000/$1;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}